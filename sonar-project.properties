sonar.projectKey=grigoriev_weasyvsdx
sonar.organization=grigoriev

sonar.sources=src,tools
sonar.tests=tests

sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,**/*.pyc

# The bench and the corpus scripts are dev tools that run in Docker or against the network, not under pytest
sonar.coverage.exclusions=tests/**,tools/**

# pythonsecurity:S2083 takes the corpus files the bench and the references read as user input. Both are
# local dev tools, no service: they run from the command line, on the files of corpus/ and of the cache.
sonar.issue.ignore.multicriteria=benchpath,referencespath,comparisonpath
sonar.issue.ignore.multicriteria.benchpath.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.benchpath.resourceKey=tools/visual/bench.py
sonar.issue.ignore.multicriteria.referencespath.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.referencespath.resourceKey=tools/visual/make_references.py
sonar.issue.ignore.multicriteria.comparisonpath.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.comparisonpath.resourceKey=tools/visual/comparison.py
