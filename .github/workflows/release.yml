name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python ${{ matrix.python-version }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --all-extras

      - name: Type check with mypy
        run: uv run mypy src tests tools

      # The tests run in Dockerfile.test, with Pango, emf2svg, the fonts they assume and libvisio 0.1.7 of
      # Debian 13. The runner would bring the libvisio of its Ubuntu, 0.1.10 from Ubuntu 26.04 on.
      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: make test BASE="python:${PYTHON_VERSION}-slim-trixie"

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The notes come from the CHANGELOG.md section that bump-version.yml cut.
      # A tag without that section fails here, before anything is published.
      - name: Read the release notes from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      # Releases are immutable: the release gets all its files in the one create
      # call below. A tag that has a release already stops here, before the build.
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only "not found" (HTTP 404) lets the release go on. Any other lookup
          # error stops it too, so an API failure never reads as "no release".
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1); then
            echo "::error::Release $GITHUB_REF_NAME exists. Releases are immutable: release a new version."
            exit 1
          fi
          case "$out" in
            *"(HTTP 404)"*) echo "No release $GITHUB_REF_NAME yet." ;;
            *) echo "::error::Cannot look up release $GITHUB_REF_NAME: $out"; exit 1 ;;
          esac

      - name: Build package
        run: uv build

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Keep the package for the publishing jobs
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          # The signed provenance bundle and the notes travel beside dist/, which holds the package alone
          cp "$BUNDLE" "$RUNNER_TEMP/release/weasyvsdx-${GITHUB_REF_NAME#v}.intoto.jsonl"
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  # PyPI first: a file there can never be replaced, so the GitHub release waits for it.
  # Trusted Publishing: PyPI accepts the OIDC token of this workflow in the pypi environment, no secret.
  pypi:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/weasyvsdx/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Uploads PEP 740 attestations of the files along with them. After a partial upload, re-run the
      # failed jobs only: they take the same files from the build job, and PyPI accepts a file it holds
      # with the same hashes, while it refuses one with other content. A full re-run builds anew.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    runs-on: ubuntu-latest
    needs: pypi
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/

      # Releases are immutable: the release gets all its files in this one call
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz release/*.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" --notes-file release/release-notes.md
