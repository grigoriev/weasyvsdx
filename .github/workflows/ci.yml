name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main gets
# its own group, so a queued main run is never replaced by a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks the workflows themselves: expressions, inputs, shell in run.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      # Security audit of the workflows, for example template injection or
      # credentials left in the checkout. Informational findings do not fail.
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          min-severity: low
          version: 1.31.1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python ${{ matrix.python-version }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src tests tools

      # The tests run in Dockerfile.test, with Pango, emf2svg, the fonts they assume and libvisio 0.1.7 of
      # Debian 13. The runner would bring the libvisio of its Ubuntu, 0.1.10 from Ubuntu 26.04 on.
      - name: Run tests with coverage
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: make test BASE="python:${PYTHON_VERSION}-slim-trixie"

  # The other libvisio weasyvsdx is tested with: 0.1.11, the latest, from Debian testing, on the newest Python
  test-libvisio:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests with libvisio 0.1.11
        run: make test BASE="python:3.14-slim-trixie" LIBVISIO=0.1.11

  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Pango, libvisio-tools, emf2svg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libvisio-tools emf2svg \
            fonts-dejavu-core fonts-liberation

      # In Dockerfile.test, as the tests; coverage.xml lands in the checkout with paths relative to it
      - name: Run tests with coverage
        run: make test

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, test-libvisio, sonar]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
